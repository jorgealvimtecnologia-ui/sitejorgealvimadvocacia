name: Deploy (manual)

# CI/CD opcional com rollback. É DISPARADO À MÃO (workflow_dispatch), nunca
# automaticamente, para não publicar sem querer. Antes de enviar, roda os testes;
# faz backup completo no servidor (para rollback via reverter-deploy.bat) e só então
# copia os arquivos e reinicia o serviço.
#
# PARA ATIVAR: em Settings > Secrets and variables > Actions, crie os secrets:
#   DEPLOY_SSH_KEY   -> a chave privada SSH (id_ed25519_161_97_71_14)
#   DEPLOY_HOST      -> 161.97.71.14
#   DEPLOY_USER      -> root
#   DEPLOY_PATH      -> /var/www/advocacia   (ou .../advocacia-staging)
#   DEPLOY_SERVICE   -> advocacia            (ou advocacia-staging)
#   DEPLOY_PORT      -> 3000  (opcional; usado no health check)
# Sem esses secrets, o job para no passo de verificação (não faz nada).
#
# AUTO-ROLLBACK: o passo de deploy roda scripts/deploy-remote.sh no servidor, que
# reinicia e checa /health; se falhar, RESTAURA o último backup automaticamente e o
# job falha (mas o site continua no ar na versão anterior). Versão implantada fica
# registrada em backups/DEPLOYED (data/hora + commit).

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Ambiente'
        required: true
        default: 'staging'
        type: choice
        options: [staging, producao]

jobs:
  deploy:
    name: Testar e publicar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Rodar testes (barra deploy quebrado)
        run: npm test

      - name: Verificar secrets de deploy
        run: |
          if [ -z "${{ secrets.DEPLOY_SSH_KEY }}" ] || [ -z "${{ secrets.DEPLOY_HOST }}" ]; then
            echo "::error::Secrets de deploy ausentes. Configure DEPLOY_* em Settings > Secrets (veja docs/INFRA.md)."
            exit 1
          fi

      - name: Preparar chave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Backup completo + envio + deploy com AUTO-ROLLBACK
        env:
          H: ${{ secrets.DEPLOY_HOST }}
          U: ${{ secrets.DEPLOY_USER }}
          P: ${{ secrets.DEPLOY_PATH }}
          S: ${{ secrets.DEPLOY_SERVICE }}
          PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -e
          SHA=$(git rev-parse --short HEAD)
          PORT="${PORT:-3000}"
          # 1) Backup completo (para rollback) — grava backups/LAST.
          ssh -i ~/.ssh/id_deploy "$U@$H" "D=$P/backups/predeploy-\$(date +%Y%m%d-%H%M%S); mkdir -p \$D && cp -r $P/server.js $P/painel.html $P/index.html $P/blog.html $P/cliente.html $P/colaborador.html $P/src $P/public \$D/ 2>/dev/null; echo \$D > $P/backups/LAST && echo Backup: \$D"
          # 2) Envio dos arquivos (inclui scripts/ com o deploy-remote.sh).
          scp -i ~/.ssh/id_deploy -r server.js painel.html index.html blog.html cliente.html colaborador.html src public scripts "$U@$H:$P/"
          # 3) Deploy inteligente no servidor: perms -> restart -> health;
          #    se o health falhar, REVERTE automaticamente para o último backup.
          #    Exit 0=OK, 1=revertido (site no ar na versão anterior), 2/3=falha grave.
          set +e
          ssh -i ~/.ssh/id_deploy "$U@$H" "chmod +x $P/scripts/deploy-remote.sh 2>/dev/null; bash $P/scripts/deploy-remote.sh $P $S $PORT $SHA"
          RC=$?
          set -e
          if [ "$RC" = "0" ]; then echo "::notice::Deploy OK (commit $SHA no ar)."; exit 0; fi
          if [ "$RC" = "1" ]; then echo "::error::Deploy falhou no health check e foi REVERTIDO automaticamente. Site no ar na versão anterior."; exit 1; fi
          echo "::error::Falha grave no deploy/rollback (código $RC). Intervenção manual necessária."; exit 1

      - name: Health check externo pós-deploy
        if: success()
        env:
          H: ${{ secrets.DEPLOY_HOST }}
        run: |
          sleep 2
          curl -fsS "https://$H/health" && echo " (OK)" || echo "aviso: health externo não respondeu (verifique DNS/nginx)"
