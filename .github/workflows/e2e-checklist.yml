name: Playwright E2E Checklist

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Execução noturna diária às 03:00 UTC (00:00 BRT)
    - cron: '0 3 * * *'

jobs:
  e2e-checklist:
    name: Checklist Automatizado de Produção (9 Páginas)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Instalar navegadores Playwright (Chromium headless)
        run: npx playwright install --with-deps chromium

      - name: Validação do Guardião de Arquitetura Modular
        run: npm run check:architecture

      - name: Executar Checklist E2E de Produção
        run: npm run test:checklist

      - name: Salvar relatório HTML do Playwright (em caso de falha)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
