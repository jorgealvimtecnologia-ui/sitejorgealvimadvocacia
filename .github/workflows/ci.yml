name: CI

# Roda em pushes e Pull Requests para a branch principal.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint + Testes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 24
        # Node 24: a mesma versão do servidor de produção, do Dockerfile, do .nvmrc e do README (teste tests/node-version.test.js).
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Checagem de Arquitetura Modular
        run: npm run check:architecture

      - name: ESLint (falha em ERROS; avisos não bloqueiam)
        run: npm run lint

      - name: Testes de integração (node:test + Supertest)
        run: npm test

      - name: Auditoria de dependências (npm audit — produção, high+)
        # BLOQUEIA a entrega se houver vulnerabilidade high/critical nas dependências
        # de PRODUÇÃO (OWASP A06). Ferramentas só de desenvolvimento (cadeia do Tailwind)
        # ficam de fora: não vão para o servidor (docs/SECURITY.md, seção de dependências).
        run: npm run audit

      - name: Build do front (Vite)
        # Bloqueia a entrega se o build quebrar (o HTML legado hoje compila normalmente).
        run: npm run build
